<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cake da Bina">
  <!-- Fundo blush (identidade da marca) -->
  <circle cx="32" cy="32" r="30" fill="#edd4da"/>
  <!-- Sparkles -->
  <path d="M13 22 L13.8 19.7 L14.6 22 L16.8 22.8 L14.6 23.6 L13.8 25.8 L13 23.6 L10.8 22.8 Z" fill="#7b4640"/>
  <path d="M49 37 L49.7 35.1 L50.4 37 L52.2 37.8 L50.4 38.6 L49.7 40.5 L49 38.6 L47.2 37.8 Z" fill="#7b4640"/>
  <path d="M45 18 L45.5 16.8 L46 18 L47.1 18.5 L46 19 L45.5 20.2 L45 19 L43.9 18.5 Z" fill="#7b4640" opacity="0.8"/>
  <!-- Redoma -->
  <path d="M17 43 A14 14 0 0 1 47 43" fill="none" stroke="#7b4640" stroke-width="2" stroke-linecap="round"/>
  <!-- Finial da redoma -->
  <circle cx="32" cy="29.5" r="1.4" fill="#7b4640"/>
  <!-- Bandeja/prato -->
  <rect x="13" y="43" width="38" height="2.8" rx="1.4" fill="#7b4640"/>
  <!-- Suporte do pedestal -->
  <rect x="31" y="45.8" width="2.4" height="5.5" fill="#7b4640"/>
  <rect x="25" y="51.3" width="14" height="2.6" rx="1.3" fill="#7b4640"/>
  <!-- Cupcake: base com frills -->
  <path d="M25 43 L39 43 L37.2 34.5 L26.8 34.5 Z" fill="none" stroke="#7b4640" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="29" y1="34.5" x2="28.4" y2="43" stroke="#7b4640" stroke-width="0.9"/>
  <line x1="32" y1="34.5" x2="32" y2="43" stroke="#7b4640" stroke-width="0.9"/>
  <line x1="35" y1="34.5" x2="35.6" y2="43" stroke="#7b4640" stroke-width="0.9"/>
  <!-- Cupcake: cobertura em swirl -->
  <path d="M25.3 34.5 Q32 28 38.7 34.5" fill="none" stroke="#7b4640" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M27.5 32.4 Q32 29.2 36.5 32.4" fill="none" stroke="#7b4640" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M30 30.8 Q32 29.5 34 30.8" fill="none" stroke="#7b4640" stroke-width="1" stroke-linecap="round"/>
</svg>

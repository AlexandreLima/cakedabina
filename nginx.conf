# Configuração Nginx otimizada para site estático com Caddy
server {
    listen 80;
    server_name _;

    # ────────────────────────────────────────────────────────────────
    # COMPRESSÃO GZIP
    # ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json image/svg+xml
               image/webp;

    # ────────────────────────────────────────────────────────────────
    # CACHE
    # ────────────────────────────────────────────────────────────────
    # Arquivos estáticos (CSS, JS, imagens) — 30 dias
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|woff2|woff|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML — 1 hora com todos os headers de segurança
    location ~* \.html?$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' https://www.googletagmanager.com 'sha256-m+Gu2TtL8lX3XWXIX2G4lACSu/EYZCqre7qF1f3kMW4='; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    }

    # ────────────────────────────────────────────────────────────────
    # SEGURANÇA - HEADERS (aplicados a respostas sem location próprio)
    # ────────────────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' https://www.googletagmanager.com 'sha256-m+Gu2TtL8lX3XWXIX2G4lACSu/EYZCqre7qF1f3kMW4='; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # ────────────────────────────────────────────────────────────────
    # ROOT DOCUMENT
    # ────────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ────────────────────────────────────────────────────────────────
    # ROTA PRINCIPAL
    # ────────────────────────────────────────────────────────────────
    location / {
        # Try file, otherwise serve index.html (SPA fallback)
        try_files $uri $uri/ /index.html;

        # Tipo de conteúdo
        default_type text/html;
    }

    # ────────────────────────────────────────────────────────────────
    # ROTA DE ASSETS (Imagens, CSS, JS)
    # ────────────────────────────────────────────────────────────────
    location /images/ {
        try_files $uri =404;
    }

    # ────────────────────────────────────────────────────────────────
    # HEALTH CHECK (Traefik)
    # ────────────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ────────────────────────────────────────────────────────────────
    # 404 CUSTOMIZADO
    # ────────────────────────────────────────────────────────────────
    error_page 404 /index.html;

    # ────────────────────────────────────────────────────────────────
    # DENY ACESSO A ARQUIVOS SENSÍVEIS
    # ────────────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Configuração Nginx otimizada para site estático com Traefik
server {
    listen 80;
    server_name _;

    # ────────────────────────────────────────────────────────────────
    # COMPRESSÃO GZIP
    # ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json image/svg+xml;

    # ────────────────────────────────────────────────────────────────
    # CACHE
    # ────────────────────────────────────────────────────────────────
    # Arquivos estáticos (CSS, JS, imagens) — 30 dias
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|woff2|woff|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML — 1 hora (permite atualizações frequentes)
    location ~* \.html?$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ────────────────────────────────────────────────────────────────
    # SEGURANÇA - HEADERS
    # ────────────────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ────────────────────────────────────────────────────────────────
    # ROOT DOCUMENT
    # ────────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ────────────────────────────────────────────────────────────────
    # ROTA PRINCIPAL
    # ────────────────────────────────────────────────────────────────
    location / {
        # Try file, otherwise serve index.html (SPA fallback)
        try_files $uri $uri/ /index.html;

        # Tipo de conteúdo
        default_type text/html;
    }

    # ────────────────────────────────────────────────────────────────
    # ROTA DE ASSETS (Imagens, CSS, JS)
    # ────────────────────────────────────────────────────────────────
    location /images/ {
        try_files $uri =404;
    }

    # ────────────────────────────────────────────────────────────────
    # HEALTH CHECK (Traefik)
    # ────────────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ────────────────────────────────────────────────────────────────
    # 404 CUSTOMIZADO
    # ────────────────────────────────────────────────────────────────
    error_page 404 /index.html;

    # ────────────────────────────────────────────────────────────────
    # DENY ACESSO A ARQUIVOS SENSÍVEIS
    # ────────────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

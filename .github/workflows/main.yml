name: CI/CD - Deploy to Hostinger VPS
 
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
 
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
 
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
 
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  test:
    runs-on: ubuntu-latest
    needs: build
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cakedabina:test
          load: true
 
      - name: Run tests in container
        run: |
          docker run --rm cakedabina:test sh -c "
            echo '✓ Checking HTML validity...'
            if command -v html5-validator &> /dev/null; then
              html5-validator /usr/share/nginx/html/index.html || true
            fi
            echo '✓ Checking for broken assets...'
            grep -o 'src=\"[^\"]*\"' /usr/share/nginx/html/index.html | grep -v 'data:' | sort -u
            echo '✓ Verifying nginx config...'
            nginx -t
          "
 
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          DEPLOY_PATH: /home/site-cakedabina
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $VPS_SSH_PORT -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
 
          # Create SSH config
          cat > ~/.ssh/config << EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            Port $VPS_SSH_PORT
            StrictHostKeyChecking no
          EOF
 
          # Deploy steps
          echo "🚀 Starting deployment to $VPS_HOST..."
 
          ssh vps "
            set -e
 
            echo '📁 Entering deployment directory...'
            cd $DEPLOY_PATH || mkdir -p $DEPLOY_PATH && cd $DEPLOY_PATH
 
            echo '🔄 Pulling latest code...'
            if [ -d '.git' ]; then
              git fetch origin
              git checkout $(git rev-parse --abbrev-ref HEAD)
              git pull origin $(git rev-parse --abbrev-ref HEAD)
            else
              git clone ${{ github.server_url }}/${{ github.repository }}.git .
            fi
 
            echo '🐳 Pulling latest Docker image...'
            docker pull ${{ needs.build.outputs.image-tag }}
 
            echo '⏹️ Stopping old container...'
            docker-compose -f docker-compose.prod.yml down || true
 
            echo '🚀 Starting new container...'
            docker-compose -f docker-compose.prod.yml up -d
 
            echo '⏳ Waiting for container to be healthy...'
            for i in {1..30}; do
              if curl -f http://localhost:80/health > /dev/null 2>&1; then
                echo '✅ Container is healthy!'
                break
              fi
              echo \"Attempt \$i/30: Waiting for container health check...\"
              sleep 2
            done
 
            echo '🧹 Pruning old images...'
            docker image prune -a -f --filter 'until=72h' || true
 
            echo '✅ Deployment completed successfully!'
          "
 
      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
 
          cat > ~/.ssh/config << EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            Port $VPS_SSH_PORT
            StrictHostKeyChecking no
          EOF
 
          echo "🔍 Verifying deployment..."
          ssh vps "
            echo '📊 Docker containers status:'
            docker ps -a
 
            echo ''
            echo '📋 Docker compose logs (last 20 lines):'
            docker-compose -f /home/site-cakedabina/docker-compose.prod.yml logs --tail=20 || true
 
            echo ''
            echo '🌐 Website accessibility test:'
            curl -s -o /dev/null -w 'HTTP Status: %{http_code}\n' http://localhost:80/health || echo 'Health check endpoint not available'
          "
 
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment to ${{ secrets.VPS_HOST }} completed successfully!"
          echo "🌍 Website should be live at: https://cakedabina.com.br"
 
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check the logs above for details."
          exit 1
